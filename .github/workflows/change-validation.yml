name: Change Validation

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      git_ref: ${{ github.ref }}

  required-status-checks:
    name: "Required Status Checks"  # do not change, used in ruleset "Required Status Checks"
    if: ${{ always() }}
    needs:
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Check validation job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status \
            'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "$NEEDS"
