name: Build Image Util
run-name: Build image util (${{ github.ref_name }})

"on":
  schedule:
    - cron: "23 2 * * 2"
  push:
    tags: ["*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      GIT_REF: ${{ steps.ref.outputs.GIT_REF }}
      VERSION_TAG: ${{ steps.ref.outputs.VERSION_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            git fetch --tags
            git_ref="$(git tag --list --sort=version:refname | tail -n 1)"
            [[ -n "${git_ref}" ]] || { echo "No release tag found." >&2; exit 1; }
            version_tag="${git_ref}"
          else
            git_ref="${GITHUB_REF_NAME}"
            version_tag="${GITHUB_SHA::7}"
          fi
          {
            echo "GIT_REF=${git_ref}"
            echo "VERSION_TAG=${version_tag}"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve-ref
    uses: ./.github/workflows/lint.yml
    with:
      git_ref: ${{ needs.resolve-ref.outputs.GIT_REF }}

  build:
    name: Build ${{ matrix.variant }}
    needs: [resolve-ref, lint]
    permissions:
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: agent-version
          - variant: credential-agent
    uses: ./.github/workflows/build-image.yml
    with:
      git_ref: ${{ needs.resolve-ref.outputs.GIT_REF }}
      version_tag: ${{ needs.resolve-ref.outputs.VERSION_TAG }}
      variant: ${{ matrix.variant }}
    secrets: inherit
