name: Build All Util Images
run-name: Build All Util Images (${{ github.ref_name }})

"on":
  schedule:
    # Weekly on Tuesday at 02:23 UTC
    - cron: "23 2 * * 2"
  push:
    tags:
      - "*"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  OWNER: ${{ github.repository_owner }}
  PACKAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      GIT_REF: ${{ steps.ref.outputs.GIT_REF }}
      VERSION_TAG: ${{ steps.ref.outputs.VERSION_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve git ref
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            git fetch --tags
            GIT_REF="$(git tag --list --sort=version:refname | tail -n 1)"
            if [[ -z "${GIT_REF}" ]]; then
              echo "Git tag is empty for latest release" >&2
              exit 1
            fi
            VERSION_TAG="${GIT_REF}"
          else
            GIT_REF="${GITHUB_REF_NAME}"
            VERSION_TAG="${GITHUB_SHA::7}"
          fi
          {
            echo "GIT_REF=${GIT_REF}"
            echo "VERSION_TAG=${VERSION_TAG}"
          } | tee /dev/stderr >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve-ref
    uses: ./.github/workflows/lint.yml
    with:
      git_ref: ${{ needs.resolve-ref.outputs.GIT_REF }}

  build:
    name: "${{ matrix.variant }}: Build and test image"
    needs: [resolve-ref, lint]
    permissions:
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: agent-version
    uses: ./.github/workflows/build-image.yml
    with:
      git_ref: ${{ needs.resolve-ref.outputs.GIT_REF }}
      version_tag: ${{ needs.resolve-ref.outputs.VERSION_TAG }}
      variant: ${{ matrix.variant }}
